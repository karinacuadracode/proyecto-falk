<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="FALK, plataforma de aprendizaje online. Iniciá sesión para acceder a tus cursos y a tu calendario académico.">
    <meta name="keywords" content="FALK, aprendizaje online, cursos, LMS, plataforma educativa">
    <meta name="robots" content="index, follow">

    <title>FALK | Iniciar sesión</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!--CSS-->
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>
    <header class="encabezado">
        <img src="pictures/logo-falk.png" alt="FALK - Plataforma de aprendizaje online" class="logo">
    </header>

    <main class="acceso">
        <h1>Login</h1>
        <p class="subtitulo">Ingresá para continuar</p>

        <form id="form-login" method="post" novalidate>
            <label for="usuario" class="sr-only">Usuario o email</label>
            <input type="text" id="usuario" name="usuario" placeholder="Usuario o email"
                   autocomplete="username" required maxlength="255">

            <label for="contrasena" class="sr-only">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="Contraseña"
                   autocomplete="current-password" required maxlength="72">

            <p id="mensaje-error" role="alert" aria-live="polite"></p>

            <button type="submit">Ingresar</button>
        </form>

        <a href="pages-front/recuperar-password.html" class="link-olvide">¿Olvidaste tu contraseña?</a>

        <div class="registro">
            <p>¿No tenés cuenta?</p>
            <a href="pages-front/crear-cuenta.html" class="boton-secundario">Crear cuenta</a>
        </div>
    </main>

    <footer class="footer">
        <p class="sitio">www.aprendizajefalk.com</p>
    </footer>

    <!--JavaScript-->
    <script src="js/login.js"></script>
</body>

</html>
