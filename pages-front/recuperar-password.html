<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Recuperá el acceso a tu cuenta de FALK, plataforma de aprendizaje online.">
    <meta name="keywords" content="FALK, crear cuenta, registro, aprendizaje online, cursos">
    <meta name="robots" content="index, follow">

    <title>FALK | Recuperar contraseña</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!--CSS-->
    <link rel="stylesheet" href="../styles/styles.css">
</head>

<body>
    <header class="encabezado">
        <img src="../pictures/logo-falk.png" alt="FALK - Plataforma de aprendizaje online" class="logo">
    </header>

    <main class="acceso">
        <h1 class="titulo-registro">Recuperar contraseña</h1>
        <p class="subtitulo">Ingresá tu email y te enviaremos un enlace para restablecerla</p>

        <form id="form-recuperar" novalidate>
            <label for="email" class="sr-only">Email</label>
            <input type="email" id="email" placeholder="Email" autocomplete="email">

            <p id="mensaje-error" role="alert"></p>

            <button type="submit">Enviar</button>
        </form>

        <div class="registro">
            <p>¿Recordaste tu contraseña?</p>
            <a href="../index.html" class="boton-secundario">Iniciar sesión</a>
        </div>
    </main>

    <footer class="footer">
        <p class="sitio">www.aprendizajefalk.com</p>
    </footer>

    <!--JavaScript-->
    <script src="../js/recuperar.js"></script>
</body>

</html>
