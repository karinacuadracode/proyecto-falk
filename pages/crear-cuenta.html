<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Creá tu cuenta en FALK, plataforma de aprendizaje online, y empezá a cursar.">
    <meta name="keywords" content="FALK, crear cuenta, registro, aprendizaje online, cursos">
    <meta name="robots" content="index, follow">

    <meta name="author" content="Karina Cuadra">

    <title>FALK | Crear cuenta</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!--CSS-->
    <link rel="stylesheet" href="../styles/styles.css">
</head>

<body>
    <header class="encabezado">
        <img src="../pictures/logo-falk.png" alt="FALK - Plataforma de aprendizaje online" class="logo">
    </header>

    <main class="acceso">
        <h1 class="titulo-registro">Crear nueva cuenta</h1>

        <form id="form-registro" novalidate>
            <label for="usuario" class="sr-only">Usuario</label>
            <input type="text" id="usuario" placeholder="Usuario" autocomplete="username">

            <label for="email" class="sr-only">Email</label>
            <input type="email" id="email" placeholder="Email" autocomplete="email">

            <label for="contrasena" class="sr-only">Contraseña</label>
            <input type="password" id="contrasena" placeholder="Contraseña" autocomplete="new-password">

            <p id="mensaje-error" role="alert"></p>

            <button type="submit">Registrate</button>
        </form>

        <div class="registro">
            <p>¿Ya tenés cuenta?</p>
            <a href="../index.html" class="boton-secundario">Iniciar sesión</a>
        </div>
    </main>

    <footer class="footer">
        <p class="sitio">www.aprendizajefalk.com</p>
    </footer>

    <!--JavaScript-->
    <script src="../js/registro.js"></script>
</body>

</html>
